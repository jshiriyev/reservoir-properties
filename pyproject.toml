[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-properties"
version = "0.0.1"
description = "Reservoir rock and fluid property correlations: PVT, gas Z-factor, viscosity, capillary pressure and relative permeability."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Javid Shiriyev" }
]
keywords = ["petroleum engineering", "reservoir engineering", "PVT", "relative permeability", "capillary pressure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Natural Language :: English"
]
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scipy>=1.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "mypy"
]
plots = [
    "matplotlib"
]

[project.urls]
Homepage = "https://github.com/jshiriyev/reservoir-properties"
Documentation = "https://github.com/jshiriyev/reservoir-properties/tree/main/docs"
Issues = "https://github.com/jshiriyev/reservoir-properties/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["resprops*"]

[tool.setuptools.package-data]
resprops = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "docs",
    "pytest-cache-files-*"
]
